<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>guide-book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="../../node_modules/@webcomponents/webcomponentsjs/webcomponents-bundle.js"></script>
    <script src="../../node_modules/chai/chai.js"></script>
    <script src="../../node_modules/mocha/mocha.js"></script>
    <script src="../../node_modules/wct-mocha/wct-mocha.js"></script>
    <script src="../../node_modules/sinon/pkg/sinon.js"></script>
  </head>
  <body>
    <test-fixture id="basic">
      <template>
        <guide-book></guide-book>
      </template>
    </test-fixture>

    <script type="module">
      import '@polymer/test-fixture';
      import '../../src/guide-book.js';

      describe('GuideBook', function() {
        let guidebook;
        beforeEach(function() {
          guidebook = fixture('basic');
          // Make tests wait until element is rendered.
          return guidebook.updateComplete;
        });

        it('starts inactive', function() {
          expect(guidebook.active).to.be.false;
        });

        it('emits write event if isValid is true', function() {
          let writeEventSpy = sinon.spy();
          let isValid = sinon.stub(guidebook, 'validateGuidebook');
          isValid.returns(true);
          guidebook.addEventListener('writeGuidebook', writeEventSpy);
          guidebook.handleWriteClick();
          expect(writeEventSpy.called).to.be.true;
        });

        it('does not emit write event if isValid is false', function() {
          let writeEventSpy = sinon.spy();
          let isValid = sinon.stub(guidebook, 'validateGuidebook');
          isValid.returns(false);
          guidebook.addEventListener('writeGuidebook', writeEventSpy);
          guidebook.handleWriteClick();
          expect(writeEventSpy.called).to.be.false;
        });

        it('validateGuidebook returns false if any of validate is false', function() {
          let getElementByIdStub = sinon.stub(guidebook.shadowRoot, 'getElementById');
          let falseStub = sinon.stub().returns(false);
          let trueStub = sinon.stub().returns(true);
          getElementByIdStub.withArgs('guidebook-title').returns({validate: trueStub});
          getElementByIdStub.withArgs('guidebook-description').returns({validate: trueStub});
          getElementByIdStub.withArgs('destination-url').returns({validate: trueStub});
          getElementByIdStub.withArgs('destination-description').returns({validate: falseStub});
          expect(guidebook.validateGuidebook()).to.be.false;
        });

        it('validateGuidebook returns true if all the validate are true', function() {
          let getElementByIdStub = sinon.stub(guidebook.shadowRoot, 'getElementById');
          let trueStub = sinon.stub().returns(true);
          getElementByIdStub.returns({validate: trueStub});
          expect(guidebook.validateGuidebook()).to.be.true;
        });
      });
    </script>
  </body>
</html>
